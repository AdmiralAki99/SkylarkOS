<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylark ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #ffffff;
        }

        .header p {
            font-size: 0.78rem;
            color: #555;
            margin-top: 4px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .viewfinder {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #0a0a0a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .viewfinder-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .face-guide {
            width: 55%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(0, 170, 255, 0.25);
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #555;
        }

        #progress-count {
            color: #00aaff;
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            height: 4px;
            background: #1e1e1e;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00aaff;
            border-radius: 2px;
            transition: width 0.2s ease;
        }

        #btn {
            background: #00aaff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: background 0.15s ease, opacity 0.15s ease;
            width: 100%;
        }

        #btn:hover:not(:disabled) {
            background: #29bbff;
        }

        #btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #btn.stop {
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333;
        }

        #btn.stop:hover {
            background: #2a2a2a;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            transition: background 0.2s ease;
        }

        .dot.ready    { background: #444; }
        .dot.active   { background: #00aaff; }
        .dot.warning  { background: #f5a623; }
        .dot.success  { background: #2ecc71; }
        .dot.error    { background: #e74c3c; }

        #status-text {
            color: #555;
            transition: color 0.2s ease;
        }

        #status-text.active   { color: #00aaff; }
        #status-text.warning  { color: #f5a623; }
        #status-text.success  { color: #2ecc71; }
        #status-text.error    { color: #e74c3c; }

        canvas { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>SKYLARK ID</h1>
            <p>Face Enrollment</p>
        </div>

        <div class="viewfinder">
            <video id="video" autoplay playsinline muted></video>
            <div class="viewfinder-overlay">
                <div class="face-guide"></div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-label">
                <span>Frames captured</span>
                <span id="progress-count">0 / 30</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <button id="btn">Start Enrollment</button>

        <div class="status-row">
            <div class="dot ready" id="dot"></div>
            <span id="status-text">Ready</span>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video       = document.getElementById('video');
        const canvas      = document.getElementById('canvas');
        const btn         = document.getElementById('btn');
        const dot         = document.getElementById('dot');
        const statusText  = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const progressCount = document.getElementById('progress-count');

        const FRAMES_REQUIRED = 30;
        const CAPTURE_INTERVAL_MS = 200;

        let capturing = false;
        let intervalId = null;
        let framesCollected = 0;

        function setStatus(state, text) {
            dot.className = `dot ${state}`;
            statusText.className = state;
            statusText.textContent = text;
        }

        function updateProgress(count) {
            framesCollected = count;
            progressCount.textContent = `${count} / ${FRAMES_REQUIRED}`;
            progressFill.style.width = `${(count / FRAMES_REQUIRED) * 100}%`;
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 320, height: 320 }
                });
                video.srcObject = stream;
                setStatus('ready', 'Ready');
            } catch (err) {
                setStatus('error', 'Camera error — check permissions');
                btn.disabled = true;
            }
        }

        async function captureAndSend() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                if (!blob) return;

                const form = new FormData();
                form.append('image', blob, 'frame.jpg');

                try {
                    const res = await fetch('/enroll/frame', { method: 'POST', body: form });
                    const data = await res.json();

                    if (data.status === 'no_face') {
                        setStatus('warning', 'No face detected — adjust position');
                    } else if (data.status === 'ok') {
                        updateProgress(data.frames_collected);
                        setStatus('active', `Capturing — ${data.frames_collected} / ${FRAMES_REQUIRED}`);
                    } else if (data.status === 'enrolled') {
                        updateProgress(FRAMES_REQUIRED);
                        stopCapture();
                        setStatus('success', 'Enrolled successfully');
                        btn.textContent = 'Enrolled';
                        btn.disabled = true;
                    }
                } catch {
                    setStatus('error', 'Server error');
                    stopCapture();
                }
            }, 'image/jpeg', 0.8);
        }

        function startCapture() {
            capturing = true;
            btn.textContent = 'Stop';
            btn.classList.add('stop');
            setStatus('active', 'Starting...');
            intervalId = setInterval(captureAndSend, CAPTURE_INTERVAL_MS);
        }

        function stopCapture() {
            capturing = false;
            clearInterval(intervalId);
            intervalId = null;
            if (btn.textContent === 'Stop') {
                btn.textContent = 'Start Enrollment';
                btn.classList.remove('stop');
                setStatus('ready', 'Ready');
                updateProgress(0);
            }
        }

        btn.addEventListener('click', () => {
            if (capturing) {
                stopCapture();
            } else {
                startCapture();
            }
        });

        startCamera();
    </script>
</body>
</html>
